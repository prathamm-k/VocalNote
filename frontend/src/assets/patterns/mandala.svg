<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" opacity="0.06">
  <g stroke="currentColor" stroke-width="0.8">
    <!-- Outer ring -->
    <circle cx="200" cy="200" r="180"/>
    <circle cx="200" cy="200" r="160"/>
    <circle cx="200" cy="200" r="140"/>
    <circle cx="200" cy="200" r="120"/>
    <circle cx="200" cy="200" r="100"/>
    <circle cx="200" cy="200" r="80"/>
    <circle cx="200" cy="200" r="60"/>
    <circle cx="200" cy="200" r="40"/>
    <circle cx="200" cy="200" r="20"/>
    <!-- Petal rings - 12 petals -->
    <g transform="translate(200,200)">
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(30)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(60)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(90)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(120)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(150)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(180)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(210)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(240)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(270)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(300)"/>
      <path d="M0,-180 Q30,-120 0,-60 Q-30,-120 0,-180Z" transform="rotate(330)"/>
    </g>
    <!-- Inner petal ring -->
    <g transform="translate(200,200)">
      <path d="M0,-100 Q18,-65 0,-30 Q-18,-65 0,-100Z"/>
      <path d="M0,-100 Q18,-65 0,-30 Q-18,-65 0,-100Z" transform="rotate(45)"/>
      <path d="M0,-100 Q18,-65 0,-30 Q-18,-65 0,-100Z" transform="rotate(90)"/>
      <path d="M0,-100 Q18,-65 0,-30 Q-18,-65 0,-100Z" transform="rotate(135)"/>
      <path d="M0,-100 Q18,-65 0,-30 Q-18,-65 0,-100Z" transform="rotate(180)"/>
      <path d="M0,-100 Q18,-65 0,-30 Q-18,-65 0,-100Z" transform="rotate(225)"/>
      <path d="M0,-100 Q18,-65 0,-30 Q-18,-65 0,-100Z" transform="rotate(270)"/>
      <path d="M0,-100 Q18,-65 0,-30 Q-18,-65 0,-100Z" transform="rotate(315)"/>
    </g>
    <!-- Radiating lines -->
    <g transform="translate(200,200)">
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(15)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(30)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(45)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(60)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(75)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(90)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(105)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(120)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(135)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(150)"/>
      <line x1="0" y1="-190" x2="0" y2="190" stroke-dasharray="4,8" transform="rotate(165)"/>
    </g>
    <!-- Diamond accents at 45° -->
    <g transform="translate(200,200)">
      <rect x="-6" y="-155" width="12" height="12" transform="rotate(45)" rx="1"/>
      <rect x="-6" y="-155" width="12" height="12" transform="rotate(45) rotate(90 0 0)" rx="1"/>
    </g>
  </g>
</svg>
